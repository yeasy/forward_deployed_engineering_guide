book:
  title: "Forward Deployed Engineering 指南"
  subtitle: "从现场问题发现到 AI 原生生产交付"
  author: "Baohua"
  version: "0.1.0"
  language: "zh-CN"
  description: "系统讲解 Forward Deployed Engineering 的知识、原理、技术生态、交付方法和实践案例。"

